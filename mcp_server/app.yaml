command:
  - "python"
  - "main.py"

env:
  # --- Lakebase --------------------------------------------------------
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # Own schema, not "public" -- shares the same Lakebase instance as three
  # sibling bootcamp apps without colliding. Created automatically on first
  # boot if missing. See the workspace root CLAUDE.md.
  - name: LAKEBASE_SCHEMA
    value: "research"

  # Alternative to the two secret-scope vars above: bind the secret directly
  # so the DSN arrives as an environment variable. Needs the secret added as
  # a resource on the app first (Edit -> Resources -> Add resource -> Secret,
  # resource key "lakebase-url").
  # - name: LAKEBASE_URL
  #   valueFrom: lakebase-url

  # --- Embeddings --------------------------------------------------------
  - name: EMBEDDING_MODEL_NAME
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: EMBEDDING_DIM
    value: "384"
  # Written by the app container at boot; the app's home directory is not
  # writable, but /tmp is.
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/.cache/sentence-transformers"

  # Local development only -- lets tools resolve an identity when there is no
  # Databricks proxy in front adding x-forwarded-email. Do not set this in
  # the deployed app; a missing header should fail loudly, not silently
  # attribute writes to a placeholder user. See identity.py.
  # - name: MCP_DEV_USER_EMAIL
  #   value: "you@example.com"
