# Runs harvester/snowball.py against the OpenAlex API and lands one JSON
# Lines file per seed topic in a UC Volume, which pipelines/openalex_pipeline.py
# reads as its bronze source. Also runs harvester/land_topics.py, an unrelated
# second task in the same job purely for convenience (one job to trigger
# before the first pipeline run) -- it lands the topics dimension entity from
# the Parquet snapshot, not from the API, and neither task depends on the
# other, so they run in parallel.
#
# Deliberately on-demand, not scheduled: unlike the weather-rag sibling's
# 15-minute alert resync, a citation corpus does not go stale on that
# timescale. Re-run by hand (or trigger manually in the Jobs UI) when you
# want to refresh or extend the corpus -- e.g. after adding a seed topic.
# land_topics only needs re-running if OpenAlex's topic taxonomy itself
# changes, which is rare -- harmless to re-run anyway, it just overwrites.
#
# Serverless-only workspace: no new_cluster block on either task -- a
# spark_python_task on serverless compute is required (not optional) to
# declare environment_key + a matching entry in this job's environments:
# list instead. pyarrow isn't stdlib but ships with the Databricks Runtime
# on classic clusters; serverless doesn't carry that same assumption, so
# land_topics_env declares it explicitly rather than relying on it being
# preinstalled. environment_version "2" is current as of this writing --
# if a deploy rejects it, bump the string to whatever version the error
# message says is supported.

resources:
  jobs:
    openalex_snowball_harvest:
      name: openalex-snowball-harvest
      environments:
        - environment_key: harvest_env
          spec:
            environment_version: "2"
        - environment_key: land_topics_env
          spec:
            environment_version: "2"
            dependencies:
              - pyarrow
      tasks:
        - task_key: harvest
          environment_key: harvest_env
          spark_python_task:
            python_file: ../harvester/snowball.py
            parameters:
              - "--out-dir"
              - "/Volumes/rise_of_ai_de/research_copilot/raw/harvest"
              - "--per-topic"
              - "200"

        - task_key: land_topics
          environment_key: land_topics_env
          spark_python_task:
            python_file: ../harvester/land_topics.py
            parameters:
              - "--out"
              - "/Volumes/rise_of_ai_de/research_copilot/raw/topics/topics.jsonl"
