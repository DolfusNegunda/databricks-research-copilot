# Databricks Asset Bundle for this capstone's data side: the snowball
# harvester job, the Lakeflow Declarative Pipeline, and the sync+embed job.
#
# This bundle does not deploy the two Databricks Apps (app/, mcp_server/) --
# those follow the repo's Git-folder -> Apps -> resource pattern and are
# deployed separately, same as every sibling project. It only defines the
# Jobs/Pipelines in resources/*.yml.

bundle:
  name: research-copilot

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      # profile:, not host: -- a named lookup into your local, git-ignored
      # ~/.databrickscfg (or %USERPROFILE%\.databrickscfg on Windows), never
      # a literal workspace URL committed to this file. `databricks
      # configure` or the VS Code extension's "Configure workspace" flow
      # both write a profile named DEFAULT unless you name it something
      # else -- match whatever's actually in your .databrickscfg.
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT
