command:
  - "python"
  - "app.py"

env:
  # --- Lakebase --------------------------------------------------------
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: LAKEBASE_SCHEMA
    value: "research"
  # - name: LAKEBASE_URL
  #   valueFrom: lakebase-url

  # --- Embeddings --------------------------------------------------------
  - name: EMBEDDING_MODEL_NAME
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: EMBEDDING_DIM
    value: "384"
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/.cache/sentence-transformers"

  # --- Agent Bricks --------------------------------------------------------
  # The Supervisor Agent (mas-99b20b37-endpoint) exists and is queryable from
  # this app's own service principal (permission granted, confirmed live),
  # but it can't reach mcp-research-copilot itself: "Failed to register tools
  # from Databricks App MCP server 'mcp-research-copilot': HTTP 401". Checked
  # every access-control surface the mcp-research-copilot app exposes --
  # Authorization, Settings, the Resources/Edit page -- none offers a way to
  # grant another identity permission to call in. Left commented out so this
  # tab degrades to its clean "not configured" message rather than a visible
  # error; the capstone's read+write agent requirement is already
  # demonstrated live via the AI Playground with this same MCP server.
  # - name: AGENT_SERVING_ENDPOINT
  #   value: "mas-99b20b37-endpoint"

  # Local development only -- see app.py's _current_user_email(). Do not set
  # this in the deployed app.
  # - name: FLASK_DEV_USER_EMAIL
  #   value: "you@example.com"
